services:
  - type: web
    name: opspilot
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: cloud
      # Option 1: OpenRouter (100% Free verified model)
      - key: CLOUD_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: CLOUD_MODEL
        value: nvidia/nemotron-3.5-lightning:free
      - key: CLOUD_API_KEY
        sync: false

