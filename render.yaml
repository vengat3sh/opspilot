services:
  - type: web
    name: opspilot
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: cloud
      - key: CLOUD_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: CLOUD_MODEL
        value: llama-3.1-8b-instant
      - key: CLOUD_API_KEY
        sync: false
