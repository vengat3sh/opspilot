services:
  - type: web
    name: opspilot
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: cloud
      # Option 1: OpenRouter (Free tier models like meta-llama/llama-3.2-3b-instruct:free)
      - key: CLOUD_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: CLOUD_MODEL
        value: meta-llama/llama-3.2-3b-instruct:free
      - key: CLOUD_API_KEY
        sync: false

